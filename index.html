<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ACE SSC with Raj</title>
<style>
  :root {
    --navy-deep: #0a1830;
    --navy-panel: rgba(255,255,255,0.05);
    --navy-panel-strong: rgba(255,255,255,0.08);
    --glass-border: rgba(212,175,55,0.25);
    --gold: #d4af37;
    --gold-soft: #e8cd6d;
    --white: #f4f6fa;
    --white-muted: #c3cde0;
    --danger: #e0645a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy-deep);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(212,175,55,0.10), transparent 42%),
      radial-gradient(circle at 90% 15%, rgba(212,175,55,0.07), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(212,175,55,0.06), transparent 50%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--white);
  }

  header {
    position: relative;
    text-align: center;
    padding: 56px 20px 36px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  header h1 {
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    letter-spacing: 0.5px;
    margin: 0;
    text-shadow: 0 2px 24px rgba(212,175,55,0.3);
  }

  header p {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--white-muted);
    margin-top: 12px;
    font-size: 1rem;
  }

  .admin-btn {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--navy-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .admin-btn:hover { background: rgba(212,175,55,0.15); transform: translateY(-1px); }
  .admin-btn.active { background: var(--gold); color: var(--navy-deep); }
  .admin-btn svg { width: 20px; height: 20px; }

  /* Tabs */
  .tabs {
    max-width: 1100px;
    margin: 40px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .tab-btn {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--navy-panel);
    backdrop-filter: blur(10px);
    color: var(--white-muted);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .tab-btn:hover { color: var(--white); border-color: var(--gold-soft); }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    color: var(--navy-deep);
    box-shadow: 0 6px 22px rgba(212,175,55,0.35);
    border-color: transparent;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px 24px 90px;
  }

  .panel {
    background: var(--navy-panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 30px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .panel h2 {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--gold-soft);
    font-size: 1.3rem;
    margin: 0 0 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .pdf-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 16px 16px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.2s ease;
  }
  .pdf-item:hover { background: rgba(255,255,255,0.06); }

  .pdf-item .name {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--white);
    font-size: 1rem;
    font-weight: 500;
  }

  .item-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    background: transparent;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .icon-btn:hover { background: var(--gold); color: var(--navy-deep); }
  .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }

  .icon-btn.edit { border-color: var(--white-muted); color: var(--white-muted); }
  .icon-btn.edit:hover { background: var(--white-muted); color: var(--navy-deep); }

  .empty-note {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--white-muted);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }

  .add-btn {
    margin-top: 14px;
    width: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px dashed var(--gold);
    background: transparent;
    color: var(--gold-soft);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .add-btn:hover { background: rgba(212,175,55,0.1); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,10,20,0.65);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 380px;
    background: rgba(16,34,68,0.9);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal h3 {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--gold-soft);
    margin: 0 0 18px;
    font-size: 1.15rem;
  }

  .modal label {
    display: block;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--white-muted);
    font-size: 0.82rem;
    margin: 14px 0 6px;
  }

  .modal input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--white);
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 0.95rem;
    outline: none;
  }
  .modal input:focus { border-color: var(--gold); }

  .modal-error {
    color: var(--danger);
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 0.82rem;
    margin-top: 10px;
    display: none;
  }
  .modal-error.show { display: block; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }

  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-soft)); color: var(--navy-deep); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: var(--white); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger) !important; }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--white-muted);
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 0.8rem;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<header>
  <button class="admin-btn" id="adminBtn" title="Admin login">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
  </button>
  <h1>ACE SSC with Raj</h1>
  <p>Free study material for SSC CGL, CHSL &amp; CPO aspirants</p>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="panel">
    <h2 id="sectionTitle"></h2>
    <div id="pdfList"></div>
    <button class="add-btn" id="addBtn" style="display:none;">+ Add PDF</button>
  </div>
</main>

<footer>ACE SSC with Raj — free resources for serious aspirants.</footer>

<!-- Password Modal -->
<div class="modal-overlay" id="passwordOverlay">
  <div class="modal">
    <h3>Admin Login</h3>
    <label>Enter admin code</label>
    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off">
    <p class="modal-error" id="passwordError">Incorrect code. Try again.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="passwordCancel">Cancel</button>
      <button class="btn-primary" id="passwordSubmit">Unlock</button>
    </div>
  </div>
</div>

<!-- Add/Edit Item Modal -->
<div class="modal-overlay" id="itemOverlay">
  <div class="modal">
    <h3 id="itemModalTitle">Add PDF</h3>
    <label>PDF Name</label>
    <input type="text" id="itemNameInput" placeholder="e.g. Top 100 Maths Questions">
    <label>PDF Link</label>
    <input type="text" id="itemLinkInput" placeholder="https://drive.google.com/...">
    <p class="modal-error" id="itemError">Please fill in both fields.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="itemCancel">Cancel</button>
      <button class="btn-primary" id="itemSave">Save</button>
    </div>
    <button class="btn-danger" id="itemDelete" style="width:100%;margin-top:10px;display:none;">Remove this PDF</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCDRy0sB2edBDFKLzxKVl7agMxN_LDMF4o",
    authDomain: "ace-ssc-raj.firebaseapp.com",
    projectId: "ace-ssc-raj",
    storageBucket: "ace-ssc-raj.firebasestorage.app",
    messagingSenderId: "884060968714",
    appId: "1:884060968714:web:a17d971fd9fa5f9e4a8cf3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  // Each PDF is stored as an independent document in aceSSCItems
  const itemsCol = db.collection("aceSSCItems");
  const oldDocRef = db.collection("aceSSC").doc("data");

  const ADMIN_CODE = "Raj@8840";
  const ADMIN_SESSION_KEY = "aceSSCAdmin";

  const SECTIONS = [
    { id: "maths", label: "Maths" },
    { id: "ga", label: "GA" },
    { id: "reasoning", label: "Reasoning" },
    { id: "english", label: "English" }
  ];

  const defaultData = {
    maths: [
      { name: "CGL 2025 Maths — Top 100, Chapterwise", link: "" },
      { name: "CPO 25 — Best Quant Questions", link: "" },
      { name: "CHSL PRE 25 — Best Quant Questions", link: "" }
    ],
    ga: [
      { name: "Important Books & Authors — Arun Kumar (AIR-5)", link: "" },
      { name: "Carnatic Music", link: "" },
      { name: "Industrial Policy", link: "" },
      { name: "New Criminal Laws", link: "" },
      { name: "Space CA", link: "" },
      { name: "Government Schemes", link: "" },
      { name: "Five Year Plans", link: "" }
    ],
    reasoning: [
      { name: "CGL 2025 Reasoning — Top 100+", link: "" }
    ],
    english: [
      { name: "All Vocabs by Inspector Baba", link: "" }
    ]
  };

  let data = { maths: [], ga: [], reasoning: [], english: [] };
  let isAdmin = localStorage.getItem(ADMIN_SESSION_KEY) === "true";
  let currentSection = "maths";
  let editingContext = null;
  let migrating = false;

  // Real-time listener: updates automatically whenever any document changes
  itemsCol.onSnapshot(
    async (snapshot) => {
      // First-time run: automatically import existing PDFs from old database
      if (snapshot.empty && !migrating) {
        migrating = true;
        await migrateExistingData();
        migrating = false;
        return;
      }

      const grouped = { maths: [], ga: [], reasoning: [], english: [] };
      snapshot.forEach((doc) => {
        const it = doc.data();
        const sec = it.section || "maths";
        if (!grouped[sec]) grouped[sec] = [];
        grouped[sec].push({
          id: doc.id,
          name: it.name || "",
          link: it.link || "",
          createdAt: it.createdAt || 0
        });
      });

      // Maintain consistent creation order within each section
      for (const sec in grouped) {
        grouped[sec].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      }

      data = grouped;
      render();
    },
    (err) => {
      console.error("Firestore sync error:", err);
      document.getElementById("pdfList").innerHTML =
        '<p class="empty-note">Could not load live data. Check your internet connection and refresh.</p>';
    }
  );

  // Auto-migration: copies all current PDFs from aceSSC/data into individual documents
  async function migrateExistingData() {
    try {
      const oldDoc = await oldDocRef.get();
      const source = oldDoc.exists ? oldDoc.data() : defaultData;
      const batch = db.batch();
      let count = 0;
      let timeOffset = Date.now() - 100000;

      for (const s of SECTIONS) {
        const list = source[s.id] || defaultData[s.id] || [];
        for (const it of list) {
          timeOffset += 1000;
          const newDocRef = itemsCol.doc();
          batch.set(newDocRef, {
            section: s.id,
            name: it.name,
            link: it.link || "",
            createdAt: timeOffset
          });
          count++;
        }
      }
      if (count > 0) {
        await batch.commit();
        console.log(`Migrated ${count} PDFs into aceSSCItems collection!`);
      }
    } catch (e) {
      console.error("Migration error:", e);
    }
  }

  const downloadIcon = `<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>`;
  const editIcon = `<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;

  function renderTabs() {
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = SECTIONS.map(s =>
      `<button class="tab-btn ${s.id === currentSection ? "active" : ""}" data-section="${s.id}">${s.label}</button>`
    ).join("");
    tabsEl.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentSection = btn.dataset.section;
        render();
      });
    });
  }

  function renderList() {
    const sectionMeta = SECTIONS.find(s => s.id === currentSection);
    document.getElementById("sectionTitle").textContent = sectionMeta.label + " — PDFs";

    const items = data[currentSection] || [];
    const listEl = document.getElementById("pdfList");

    if (items.length === 0) {
      listEl.innerHTML = `<p class="empty-note">No PDFs added yet in this section.</p>`;
    } else {
      listEl.innerHTML = items.map(item => `
        <div class="pdf-item">
          <span class="name">${escapeHtml(item.name)}</span>
          <div class="item-actions">
            ${isAdmin ? `<button class="icon-btn edit" data-id="${item.id}" title="Edit">${editIcon}</button>` : ""}
            <a class="icon-btn" href="${item.link ? escapeAttr(item.link) : "#"}" target="_blank" rel="noopener" title="Download">${downloadIcon}</a>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll(".icon-btn.edit").forEach(btn => {
        btn.addEventListener("click", () => openItemModal(currentSection, btn.dataset.id));
      });
    }

    document.getElementById("addBtn").style.display = isAdmin ? "block" : "none";
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  function render() {
    renderTabs();
    renderList();
    document.getElementById("adminBtn").classList.toggle("active", isAdmin);
  }

  // Admin login toggle
  const adminBtn = document.getElementById("adminBtn");
  const passwordOverlay = document.getElementById("passwordOverlay");
  const passwordInput = document.getElementById("passwordInput");
  const passwordError = document.getElementById("passwordError");

  adminBtn.addEventListener("click", () => {
    if (isAdmin) {
      isAdmin = false;
      localStorage.removeItem(ADMIN_SESSION_KEY);
      render();
      return;
    }
    passwordInput.value = "";
    passwordError.classList.remove("show");
    passwordOverlay.classList.add("show");
    setTimeout(() => passwordInput.focus(), 50);
  });

  document.getElementById("passwordCancel").addEventListener("click", () => {
    passwordOverlay.classList.remove("show");
  });

  document.getElementById("passwordSubmit").addEventListener("click", submitPassword);
  passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") submitPassword(); });

  function submitPassword() {
    if (passwordInput.value === ADMIN_CODE) {
      isAdmin = true;
      localStorage.setItem(ADMIN_SESSION_KEY, "true");
      passwordOverlay.classList.remove("show");
      render();
    } else {
      passwordError.classList.add("show");
    }
  }

  // Add / Edit item modal
  const itemOverlay = document.getElementById("itemOverlay");
  const itemModalTitle = document.getElementById("itemModalTitle");
  const itemNameInput = document.getElementById("itemNameInput");
  const itemLinkInput = document.getElementById("itemLinkInput");
  const itemError = document.getElementById("itemError");
  const itemDeleteBtn = document.getElementById("itemDelete");

  document.getElementById("addBtn").addEventListener("click", () => openItemModal(currentSection, null));
  document.getElementById("itemCancel").addEventListener("click", () => itemOverlay.classList.remove("show"));

  function openItemModal(section, id) {
    editingContext = { section, id };
    itemError.classList.remove("show");

    if (id) {
      const item = (data[section] || []).find(i => i.id === id);
      itemModalTitle.textContent = "Edit PDF";
      itemNameInput.value = item ? item.name : "";
      itemLinkInput.value = item ? item.link : "";
      itemDeleteBtn.style.display = "block";
    } else {
      itemModalTitle.textContent = "Add PDF";
      itemNameInput.value = "";
      itemLinkInput.value = "";
      itemDeleteBtn.style.display = "none";
    }

    itemOverlay.classList.add("show");
    setTimeout(() => itemNameInput.focus(), 50);
  }

  // Save: creates or updates ONLY this single document
  document.getElementById("itemSave").addEventListener("click", async () => {
    const name = itemNameInput.value.trim();
    const link = itemLinkInput.value.trim();

    if (!name || !link) {
      itemError.classList.add("show");
      return;
    }

    const saveBtn = document.getElementById("itemSave");
    const origText = saveBtn.textContent;
    saveBtn.textContent = "Saving...";
    saveBtn.disabled = true;

    try {
      const { section, id } = editingContext;
      if (id) {
        await itemsCol.doc(id).update({
          name: name,
          link: link
        });
      } else {
        await itemsCol.add({
          section: section,
          name: name,
          link: link,
          createdAt: Date.now()
        });
      }
      itemOverlay.classList.remove("show");
    } catch (err) {
      alert("Could not save: " + (err.message || err));
      console.error(err);
    } finally {
      saveBtn.textContent = origText;
      saveBtn.disabled = false;
    }
  });

  // Delete: deletes ONLY this single document
  itemDeleteBtn.addEventListener("click", async () => {
    const { id } = editingContext;
    if (!id) return;

    const origText = itemDeleteBtn.textContent;
    itemDeleteBtn.textContent = "Removing...";
    itemDeleteBtn.disabled = true;

    try {
      await itemsCol.doc(id).delete();
      itemOverlay.classList.remove("show");
    } catch (err) {
      alert("Could not delete: " + (err.message || err));
      console.error(err);
    } finally {
      itemDeleteBtn.textContent = origText;
      itemDeleteBtn.disabled = false;
    }
  });

  // Close modals on background click
  [passwordOverlay, itemOverlay].forEach(ov => {
    ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("show"); });
  });

  renderTabs();
  document.getElementById("pdfList").innerHTML = '<p class="empty-note">Loading...</p>';
</script>

</body>
</html>
